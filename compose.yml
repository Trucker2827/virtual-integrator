services:
  postgres:
    image: postgres:16-alpine
    container_name: vi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: virtualintegrator
      POSTGRES_USER: vi
      POSTGRES_PASSWORD: vi
    ports:
      - "5432:5432"
    volumes:
      - vi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vi -d virtualintegrator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vi-pgdata:
